name: Optimize landing page images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.png'
      - '*.jpg'
      - '*.jpeg'
      - '.github/workflows/optimize-images.yml'
permissions:
  contents: write
concurrency:
  group: optimize-xcore-images
  cancel-in-progress: false
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install image optimizer
        run: npm install --no-save sharp
      - name: Convert referenced images to WebP
        run: |
          cat > /tmp/optimize-images.cjs <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');
          (async () => {
            const htmlPath = 'index.html';
            let html = fs.readFileSync(htmlPath, 'utf8');
            const urls = [...html.matchAll(/https:\/\/raw\.githubusercontent\.com\/x-corefit\/x-corefit\.github\.io\/main\/([^"' )]+\.(?:png|jpe?g))/gi)];
            const files = [...new Set(urls.map(m => decodeURIComponent(m[1])))];
            let converted = 0;
            for (const file of files) {
              const input = path.basename(file);
              const output = input.replace(/\.(?:png|jpe?g)$/i, '.webp');
              if (!fs.existsSync(input)) {
                console.log('Skipping missing referenced image:', input);
                continue;
              }
              await sharp(input)
                .rotate()
                .resize({ width: 1200, height: 1600, fit: 'inside', withoutEnlargement: true })
                .webp({ quality: 78, effort: 5 })
                .toFile(output);
              converted++;
            }
            html = html.replace(
              /(https:\/\/raw\.githubusercontent\.com\/x-corefit\/x-corefit\.github\.io\/main\/)([^"' )]+?)\.(?:png|jpe?g)(?=[ "' )])/gi,
              '$1$2.webp'
            );
            fs.writeFileSync(htmlPath, html);
            console.log('Converted', converted, 'images to WebP and updated image URLs.');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          node /tmp/optimize-images.cjs
      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html *.webp
          if ! git diff --cached --quiet; then
            git commit -m "Optimize landing page images to WebP"
            git push origin main
          else
            echo "No optimized image changes to commit."
          fi
